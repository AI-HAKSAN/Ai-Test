<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 의존도 자가진단 테스트</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f5f6fa;
            color: #2f3640;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .desc {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .question-box {
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #dcdde1;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .question-box:hover {
            background: #f1f2f6;
        }
        .question-box input {
            transform: scale(1.2);
            margin-right: 15px;
            cursor: pointer;
        }
        .question-box label {
            cursor: pointer;
            font-size: 15px;
            line-height: 1.4;
            flex-grow: 1;
        }
        .btn-container {
            text-align: center;
            margin-top: 25px;
        }
        button {
            background-color: #40739e;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2f3640;
        }
        #result-section {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #dcdde1;
        }
        #result-text {
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🤖 AI 의존도 자가진단 테스트</h1>
        <p class="desc">해당하는 항목에 모두 체크하고 나의 AI 의존도를 확인해보세요.</p>

        <form id="diagnosis-form">
            <!-- 문항 1~10 -->
            <div class="question-box" onclick="toggleCheckbox('q1')">
                <input type="checkbox" name="q" id="q1">
                <label for="q1">1. AI 없이 과제나 업무를 수행하기 어렵다.</label>
            </div>
            <div class="question-box" onclick="toggleCheckbox('q2')">
                <input type="checkbox" name="q" id="q2">
                <label for="q2">2. 내가 직접 자료를 찾는 것보다 AI가 찾아준 자료가 신뢰성이 더 높다고 생각한다.</label>
            </div>
            <div class="question-box" onclick="toggleCheckbox('q3')">
                <input type="checkbox" name="q" id="q3">
                <label for="q3">3. AI가 제안한 주제를 내 생각보다 우선해서 채택하는 편이다.</label>
            </div>
            <div class="question-box" onclick="toggleCheckbox('q4')">
                <input type="checkbox" name="q" id="q4">
                <label for="q4">4. AI의 도움 없이 보고서나 발표 자료의 초안을 작성하기 어렵다.</label>
            </div>
            <div class="question-box" onclick="toggleCheckbox('q5')">
                <input type="checkbox" name="q" id="q5">
                <label for="q5">5. AI의 도움 없이 과제를 수행할 때 결과물에 대한 자신감이 낮아진다.</label>
            </div>
            <div class="question-box" onclick="toggleCheckbox('q6')">
                <input type="checkbox" name="q" id="q6">
                <label for="q6">6. AI가 출처를 제시하면 해당 정보의 신뢰성을 충분히 검토했다고 생각한다.</label>
            </div>
            <div class="question-box" onclick="toggleCheckbox('q7')">
                <input type="checkbox" name="q" id="q7">
                <label for="q7">7. 창의적인 활동이나 아이디어가 필요할 때 먼저 AI에게 아이디어를 구한다.</label>
            </div>
            <div class="question-box" onclick="toggleCheckbox('q8')">
                <input type="checkbox" name="q" id="q8">
                <label for="q8">8. 스스로 할 수 있는 과제라도 귀찮거나 시간이 오래 걸려 결국 AI를 쓰게 된다.</label>
            </div>
            <div class="question-box" onclick="toggleCheckbox('q9')">
                <input type="checkbox" name="q" id="q9">
                <label for="q9">9. 작업 시 여러 AI를 동시에 사용하고, 가장 좋은 답변을 채택한 적이 있다.</label>
            </div>
            <div class="question-box" onclick="toggleCheckbox('q10')">
                <input type="checkbox" name="q" id="q10">
                <label for="q10">10. AI를 사용할 수 있는데도 쓰지 않으면 학습 과정이 비효율적으로 느껴진다.</label>
            </div>

            <div class="btn-container">
                <button type="button" onclick="submitTest()">결과 확인하기</button>
            </div>
        </form>

        <div id="result-section">
            <h2>진단 결과</h2>
            <div id="result-text"></div>
        </div>

        <!-- 항상 화면 제일 아래에 위치하는 데이터 수집 안내 문구 -->
        <p style="text-align: center; font-size: 13px; color: #95a5a6; margin-top: 30px; margin-bottom: 0;">
            🔒 본 자가진단은 익명으로 진행되며, 수집된 데이터는 통계 분석 및 전시 목적으로만 사용됩니다.
        </p>
    </div>

    <script>
        // ★ [중요] 본인의 구글 Apps Script 웹 앱 URL을 넣으세요
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/.../exec';

        // 클릭 시 체크박스 토글 함수
        function toggleCheckbox(id) {
            const checkbox = document.getElementById(id);
            if (event.target.tagName !== 'INPUT') {
                checkbox.checked = !checkbox.checked;
            }
        }

        // 페이지가 열릴 때 이미 참여했는지 확인
        window.onload = function() {
            if (localStorage.getItem('ai_test_completed') === 'true') {
                document.getElementById('diagnosis-form').style.display = 'none';
                document.getElementById('result-section').style.display = 'block';
                document.getElementById('result-text').innerHTML = 
                    "이미 자가진단을 완료하셨습니다.<br><br><span style='font-size:14px; color:#7f8c8d; font-weight:normal;'>공정하고 정확한 통계를 위해 1인 1회만 참여 가능합니다.</span>";
            }
        };

        function submitTest() {
            const checkboxes = document.querySelectorAll('input[name="q"]:checked');
            const count = checkboxes.length;

            let resultGroup = "";
            if (count <= 2) {
                resultGroup = "AI 일반 사용자군 (1~2개)";
            } else if (count <= 4) {
                resultGroup = "AI 잠재적 위험군 (3~4개)";
            } else if (count <= 6) {
                resultGroup = "AI 중독 고위험군 (5~6개)";
            } else {
                resultGroup = "AI 과의존 위험군 (7개 이상)";
            }

            // 중복 제출 방지 (로컬 스토리지에 기록)
            localStorage.setItem('ai_test_completed', 'true');

            // 결과 화면 구성
            const resultHTML = `
                내 체크 개수: <span style="color:#e74c3c; font-weight:bold;">${count}개</span><br>
                <strong>진단 결과: ${resultGroup}</strong>
                
                <div style="margin-top: 20px; text-align: left; font-size: 14px; background: #fff; padding: 15px; border-radius: 6px; border: 1px solid #dcdde1; font-weight: normal;">
                    <div style="font-weight: bold; margin-bottom: 8px; color: #2c3e50; text-align: center;">📊 전체 등급 기준표</div>
                    <div style="padding: 4px 0; ${count >= 0 && count <= 2 ? 'color: #e74c3c; font-weight: bold;' : ''}">• 0~2개 : AI 일반 사용자군</div>
                    <div style="padding: 4px 0; ${count >= 3 && count <= 4 ? 'color: #e74c3c; font-weight: bold;' : ''}">• 3~4개 : AI 잠재적 위험군</div>
                    <div style="padding: 4px 0; ${count >= 5 && count <= 6 ? 'color: #e74c3c; font-weight: bold;' : ''}">• 5~6개 : AI 중독 고위험군</div>
                    <div style="padding: 4px 0; ${count >= 7 ? 'color: #e74c3c; font-weight: bold;' : ''}">• 7개 이상 : AI 과의존 위험군</div>
                </div>
            `;

            // 화면 전환 및 표시
            document.getElementById('diagnosis-form').style.display = 'none'; 
            document.getElementById('result-text').innerHTML = resultHTML;
            document.getElementById('result-section').style.display = 'block';
            
            document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });

            // 구글 시트로 데이터 백그라운드 전송
            const payload = {
                count: count,
                result: resultGroup
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            }).catch(error => {
                console.error('데이터 전송 중 오류 발생:', error);
            });
        }
    </script>
</body>
</html>
